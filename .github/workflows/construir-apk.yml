name: Construir APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Acomodar carpetas
        run: |
          if [ ! -f www/index.html ]; then
            mkdir -p www/icons www/vendor assets
            for f in icon-192.png icon-512.png maskable-512.png apple-touch-icon.png; do [ -f "$f" ] && mv "$f" www/icons/; done
            [ -f xlsx.mini.min.js ] && mv xlsx.mini.min.js www/vendor/
            for f in index.html app.js styles.css sw.js manifest.webmanifest; do [ -f "$f" ] && mv "$f" www/; done
            for f in icon-only.png icon-foreground.png icon-background.png; do [ -f "$f" ] && mv "$f" assets/; done
          fi
          ls -R www assets

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Poner la dirección pública de la app
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s#'__APP_URL__'#'https://${OWNER}.github.io/${REPO}/'#" www/app.js

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android con ícono
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0D5C4A' --iconBackgroundColorDark '#0D5C4A' --splashBackgroundColor '#0D5C4A' --splashBackgroundColorDark '#0D5C4A'
          npx cap sync android

      - name: Número de versión
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compilar APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.jks"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/firma.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=cuentasclaras \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../CuentasClaras.apk
          else
            echo "::warning::Sin firma propia: se genera APK de prueba. Agrega los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD para que las actualizaciones se instalen encima."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CuentasClaras.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-apk
          path: CuentasClaras.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cuentas Claras 1.0.${{ github.run_number }}
          body: Descarga CuentasClaras.apk e instálala en tu Android.
          files: CuentasClaras.apk
          make_latest: true
